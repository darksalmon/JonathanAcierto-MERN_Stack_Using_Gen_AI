<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Cart Login</title>
    <script src="checkLoginDetails.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header class="header">
        <h1 class="text-center">Discover Delicious Meals</h1>
        <span>Please Login / Register</span>
    </header>
    <hr style="border: none; height: 1px; background-color: #f8f7f7; margin: 0;">
    <hr style="border: none; height: 7px; background-color: #e85d04; margin: 0;">
    <main class="container-sm flex-grow-1 d-flex align-items-center justify-content-center py-4">
        <form action="foodMenuDashboard.html" class="login-box" onsubmit="return checkLoginDetails()">
            <div class="mb-3">
                <label for="emailId" class="form-label">Email address</label>
                <input type="email" class="form-control" id="emailId" required>
            </div>
            <div class="mb-3 mt-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
        </form>
    </main>
    <footer class="footer">
        <p class="m-0">© 2026 Online Food App | All Rights Reserved</p>
        <p class="m-0" style="font-size: 1rem;">Darksalmon Networks <i class="bi bi-badge-tm" aria-hidden="true"></i></p>
    </footer>
</body>
</html>
